name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agents-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The validator's own acceptance criterion: it must fail on a repository that is broken.
      # Running this first means a check that has silently stopped detecting anything fails loudly
      # instead of reporting a clean tree.
      - name: Validator self-test
        run: ./cli/packages/module-check/sh/unported/check-agents-md.sh --self-test

      - name: Instruction files
        run: ./cli/packages/module-check/sh/unported/check-agents-md.sh

      # governance-license ships scaffold/ensure-license-headers.sh into every repo the license-setup
      # skill touches; this is the first thing that ever actually executes it (issue #12). The path
      # moved with the file in Plan-040 Track 3 — and the test had been resolving a path that never
      # existed since the plugin/cli split, so this step had been red in CI without anybody reading it.
      - name: License-header template
        run: ./cli/test/test-license-headers.sh

  # Change intent is declared when the change is made, not at release time: a PR that touches a
  # published package carries a .changeset/*.md saying what it does to that package's contract.
  # Changesets reads that file and nothing else — never the commit message — so an undeclared change
  # reaches the registry with an empty changelog entry and a version nobody chose.
  changeset:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # status resolves the base branch through history, not the tip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx changeset status --since origin/main

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      # `npm test` builds first (pretest): the packages typecheck against each other's dist, so a
      # stale one reports a false green.
      - run: npm test

      # Same rationale as the agents-md job's first step, one layer up: a gate that has silently stopped
      # detecting reports a clean tree, which is what a working one reports too. This runs both suites —
      # the shell fragments and every ops gate that declares a fixture — and is placed after `npm test`
      # only because it needs the build `pretest` produces.
      - name: Detector self-test, both suites
        run: node cli/packages/cli/dist/bin.js check --self-test
